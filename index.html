<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HXH_ESP.Ver2｜念能力測驗</title>
  <style>
    :root { color-scheme: light; --bg:#efefef; --panel:#fff; --text:#111; --muted:#666; --line:#cfcfcf; }
    * { box-sizing: border-box; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif; }
    body { min-height:100svh; display:flex; justify-content:center; padding:24px 14px calc(32px + env(safe-area-inset-bottom)); }
    main { width:min(100%,680px); }
    .card { background:var(--panel); border:1px solid var(--line); padding:22px 18px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    h1,h2,p { margin-top:0; }
    h1 { font-size:1.45rem; margin-bottom:10px; }
    h2 { font-size:1.15rem; line-height:1.6; }
    .eyebrow,.meta { color:var(--muted); font-size:.86rem; }
    .meta { display:flex; justify-content:space-between; gap:10px; margin-bottom:12px; }
    .question { white-space:pre-line; margin:8px 0 18px; font-size:1.05rem; line-height:1.75; }
    .options { display:grid; gap:10px; }
    button { width:100%; min-height:48px; border:1px solid #aaa; background:#f7f7f7; color:#111; border-radius:6px; font:inherit; padding:12px 14px; text-align:left; cursor:pointer; }
    button:active { transform:translateY(1px); }
    button.primary { background:#111; color:#fff; border-color:#111; text-align:center; font-weight:700; }
    button.secondary { text-align:center; }
    button[disabled] { opacity:.5; cursor:not-allowed; }
    label.option { display:flex; align-items:flex-start; gap:11px; border:1px solid #aaa; border-radius:6px; background:#f7f7f7; padding:12px 14px; line-height:1.5; }
    input[type="checkbox"] { width:20px; height:20px; margin:1px 0 0; flex:0 0 auto; }
    .actions { display:grid; gap:10px; margin-top:18px; }
    .score-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0; }
    .score { border:1px solid var(--line); padding:14px; background:#fafafa; }
    .score strong { display:block; font-size:1.35rem; margin-top:4px; }
    .note { margin-top:16px; font-size:.84rem; color:var(--muted); line-height:1.6; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
<main>
  <section id="app" class="card" aria-live="polite"></section>
</main>
<script>
(() => {
  const TYPES = ["強","操","放","具","變","特"];
  const TYPE_NAMES = { 強:"強化系", 操:"操作系", 放:"放出系", 具:"具現化系", 變:"變化系", 特:"特質系" };

  const q = (id, text, options, extra={}) => ({ id, text, options, type:"single", ...extra });
  const m = (id, text, options, extra={}) => ({ id, text, options, type:"multi", ...extra });
  const o = (text, score={}, next=null) => ({ text, score, next });

  // Historical scoring data recovered from the 2019 Unity/Fungus build.
  // Values are intentionally not rebalanced or interpreted here.
  const QUESTIONS = {
    Q1: q("Q1", "有一天你走在路上看到兩隻被拋棄的黑貓，你會怎麼做？", [
      o("A 帶回家", {強:10,操:10,放:10}, "Q2A"),
      o("B 不帶回家", {特:10,具:10,變:10}, "Q2B")
    ]),
    Q2A: q("Q2", "承Q1，之後你會怎麼做？", [
      o("不管怎樣都一定要養！", {強:30}, "Q3"),
      o("想養的，不過被反對了於是去找別人養", {操:30}, "Q3"),
      o("不想養，找別人養", {放:30}, "Q3"),
      o("以上理由外", {}, "Q3")
    ]),
    Q2B: q("Q2", "承Q1，你的理由是？", [
      o("因為家裡不給養", {特:30}, "Q3"),
      o("因為黑貓不吉利", {具:30}, "Q3"),
      o("儘管現在是很可愛，總有一天會厭煩的", {變:30}, "Q3"),
      o("以上理由外", {}, "Q3")
    ]),
    Q3: q("Q3", "早上起床後發現天空烏雲密布，聽天氣預報說降雨概率為40%。你出門會帶傘嗎？", [
      o("覺得肯定會下雨於是帶上手頭的傘", {具:15,操:15}),
      o("覺得大概會下雨就帶了折疊傘", {放:15,特:15}),
      o("不帶傘", {強:15,變:15})
    ]),
    Q4: q("Q4", "和朋友約好出去玩，可是約定時間到了朋友卻沒有來。你能等多少分鐘？", [
      o("等不了", {放:30}), o("5分鐘左右", {具:30}), o("10分鐘左右", {強:30}),
      o("15分鐘左右", {特:30}), o("20分鐘左右", {變:30}), o("可以一直等下去", {操:30})
    ]),
    Q5: q("Q5", "這次是你遲到了。對方生氣了，你會怎麼做？", [
      o("道歉，3天內為對方做任何事", {具:30}), o("道歉，讓對方心情好起來", {放:30}),
      o("道歉，下次起早來20分鐘", {特:30}), o("辯解，不認錯", {變:30}),
      o("辯解，讓對方心情好起來", {操:30}), o("這種事不可能發生", {強:30})
    ]),
    Q6: q("Q6", "早上醒來你發現自己變成動物了。是什麼動物？", [
      o("綿羊", {放:30}), o("黑豹", {操:30}), o("猴子", {具:30}), o("老虎", {強:30}),
      o("狼", {變:30}), o("珀伽索斯（希臘神話中的飛馬）", {放:30}), o("獅子", {特:30})
    ]),
    Q7: q("Q7", "承Q6，為什麼這麼想？", [
      o("因為動物占卜裡自己測出來是它", {具:15,操:15}),
      o("因為喜歡這種動物", {強:15,放:15}),
      o("因為想變成這種動物", {變:15,特:15}),
      o("不為什麼", {強:5,操:5,放:5,特:5,具:5,變:5})
    ]),
    Q8: q("Q8", "你最擅長的是？", [
      o("數理", {具:35}), o("語文", {操:35}), o("社會", {放:30}), o("創作", {特:30}), o("體育", {強:30}), o("無", {變:30})
    ]),
    Q9: q("Q9", "你最討厭的是？", [
      o("數理", {強:30}), o("語文", {特:30}), o("社會", {變:30}), o("創作", {操:30}), o("體育", {具:30}), o("無", {放:30})
    ]),
    Q10: q("Q10", "如果你成為了盜賊，第一件想偷的是什麼？", [
      o("人命", {變:30}), o("錢", {強:30}), o("鑽石、寶石", {放:30}), o("美術品", {特:30}), o("古書", {具:30}), o("絕對不會成為盜賊", {操:30})
    ]),
    Q11: m("Q11", "－－－－－－－－\n－－－－進入多選題囉－－－－\nQ11\n你覺得自己的優點有？", [
      o("規規矩矩", {具:30}), o("有責任感", {強:30}), o("被人信賴", {操:30}), o("有引人注目的特長", {特:30}),
      o("對自己要求嚴格", {放:30}), o("有行動力", {強:30}), o("朋友多", {放:30}), o("反复無常難以捉摸", {變:30}),
      o("畫畫唱歌很好", {特:30}), o("利己主義", {變:30}), o("擅長精細活", {具:30}), o("我行我素", {操:30})
    ], { confirmText:"《確定》" }),
    Q12: m("Q12", "Q12\n覺得自己的缺點有？", [
      o("沒有協調性", {強:30}), o("粗心大意", {放:30}), o("愛說謊", {變:30}), o("討厭的人有10個以上", {具:30}),
      o("對錢斤斤計較", {變:30}), o("覺得沒道理的事就無法接受", {操:30}), o("自我中心", {特:30}), o("為達到目的不擇手段", {具:30}),
      o("容易生氣", {放:30}), o("淚點低", {特:30}), o("行動遲緩", {操:30}), o("容易上當", {強:30})
    ], { confirmText:"《確定 》" }),
    Q13: m("Q13", "Q13 \n什麼樣的人會讓你真的起殺心？", [
      o("殺了自己家人的人", {放:30}), o("殺了自己喜歡的人的人", {強:30}), o("給了自己最大屈辱的人", {具:30}),
      o("想殺自己的人", {操:30}), o("在自己面前大量濫殺無辜的人", {變:30}), o("背叛自己的人", {特:30})
    ], { confirmText:"《確定 》" }),
    Q14: m("Q14", "Q14\n什麼時候你會哭？", [
      o("重要的人死去時", {強:30}), o("悲傷或是感動時", {具:30}), o("被甩時", {具:30}), o("被求婚時", {放:30}),
      o("看體育項目感動時", {操:30}), o("達成某重大目標時", {強:30}), o("工作出現大失敗時", {變:30}),
      o("身邊長時間沒人時", {變:30}), o("回憶痛苦往事時", {放:30}), o("自尊被傷害時", {特:30}),
      o("被朋友背叛", {特:30}), o("不大哭", {操:30})
    ], { confirmText:"《確定 》" }),
    Q15: q("Q15", "－－－－－－－是非題來啦－－－－－\nQ15\n覺得魔術師很厲害嗎？", [
      o("是", {變:30}), o("否", {強:6,操:6,放:6,具:6,特:6})
    ]),
    Q16: q("Q16", "Q16\n用行動力逮捕犯人的警察是不對的嗎？", [
      o("是", {操:30}), o("否", {強:6,放:6,具:6,變:6,特:6})
    ]),
    Q17: q("Q17", "Q17\n書架上的書順序排得亂七八糟的話會不舒服嗎？", [
      o("是", {具:30}), o("否", {強:6,操:6,放:6,變:6,特:6})
    ]),
    Q18: q("Q18", "Q18\n絕對不會花心嗎？", [
      o("是", {強:30}), o("否", {操:6,放:6,具:6,變:6,特:6})
    ]),
    Q19: q("Q16", "Q16\n只要自己好的話其他怎樣都無所謂嗎？", [
      o("是", {特:30}), o("否", {強:6,操:6,放:6,具:6,變:6})
    ]),
    Q20: q("Q20", "Q20\n不喜歡整理收拾嗎？", [
      o("是", {放:30}), o("否", {強:6,操:6,具:6,變:6,特:6})
    ])
  };

  const NEXT = { Q3:"Q4", Q4:"Q5", Q5:"Q6", Q6:"Q7", Q7:"Q8", Q8:"Q9", Q9:"Q10", Q10:"Q11", Q11:"Q12", Q12:"Q13", Q13:"Q14", Q14:"Q15", Q15:"Q16", Q16:"Q17", Q17:"Q18", Q18:"Q19", Q19:"Q20", Q20:"RESULT" };

  let current = "START";
  const answers = {};
  const app = document.getElementById("app");

  function escapeHtml(s) { return String(s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])); }

  function renderStart() {
    app.innerHTML = `
      <p class="eyebrow">HXH_ESP.Ver2</p>
      <h1>歡迎使用念能力測驗</h1>
      <p>回答下列選擇題，測試你的念能力</p>
      <div class="actions"><button class="primary" id="startBtn">開始</button></div>
      <p class="note">歷史復刻版：題目與計分依 2019 Unity 版本復原。此版本先不重新平衡內容。</p>`;
    document.getElementById("startBtn").onclick = () => { current="Q1"; render(); };
  }

  function progressText(key) {
    if (key === "Q2A" || key === "Q2B") return "Q2 / Q20";
    const n = Number(key.replace("Q",""));
    if (Number.isFinite(n)) return `Q${n} / Q20`;
    return "";
  }

  function renderQuestion(key) {
    const item = QUESTIONS[key];
    const existing = answers[key];
    app.innerHTML = `
      <div class="meta"><span>${escapeHtml(progressText(key))}</span><span>歷史復刻</span></div>
      <div class="question">${escapeHtml(item.text)}</div>
      <div class="options" id="options"></div>
      ${item.type === "multi" ? `<div class="actions"><button class="primary" id="confirm">${escapeHtml(item.confirmText || "《確定》")}</button></div>` : ""}`;

    const box = document.getElementById("options");
    if (item.type === "single") {
      item.options.forEach((opt, idx) => {
        const b = document.createElement("button");
        b.textContent = opt.text;
        b.onclick = () => {
          answers[key] = idx;
          current = opt.next || NEXT[key] || "RESULT";
          render();
        };
        box.appendChild(b);
      });
    } else {
      const selected = new Set(Array.isArray(existing) ? existing : []);
      item.options.forEach((opt, idx) => {
        const label = document.createElement("label");
        label.className = "option";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = selected.has(idx);
        cb.addEventListener("change", () => cb.checked ? selected.add(idx) : selected.delete(idx));
        const span = document.createElement("span");
        span.textContent = opt.text;
        label.append(cb, span);
        box.appendChild(label);
      });
      document.getElementById("confirm").onclick = () => {
        answers[key] = [...selected].sort((a,b)=>a-b);
        current = NEXT[key] || "RESULT";
        render();
      };
    }
  }

  function calculateScores() {
    const total = Object.fromEntries(TYPES.map(t => [t,0]));
    for (const [key, value] of Object.entries(answers)) {
      const item = QUESTIONS[key];
      if (!item) continue;
      const indices = item.type === "multi" ? (Array.isArray(value) ? value : []) : [value];
      for (const idx of indices) {
        const opt = item.options[idx];
        if (!opt) continue;
        for (const [type, pts] of Object.entries(opt.score || {})) total[type] += pts;
      }
    }
    return total;
  }

  function renderResult() {
    const s = calculateScores();
    app.innerHTML = `
      <p class="eyebrow">結果</p>
      <h1>出來了!!</h1>
      <p>結果.....................</p>
      <div class="score-grid">
        ${TYPES.map(t => `<div class="score"><span>${TYPE_NAMES[t]}</span><strong>${s[t]} 分</strong></div>`).join("")}
      </div>
      <div class="actions"><button class="primary" id="restart">重新測驗</button></div>`;
    document.getElementById("restart").onclick = () => {
      Object.keys(answers).forEach(k => delete answers[k]);
      current = "START";
      render();
    };
  }

  function render() {
    window.scrollTo({top:0, behavior:"instant"});
    if (current === "START") return renderStart();
    if (current === "RESULT") return renderResult();
    return renderQuestion(current);
  }

  function selfTest() {
    console.assert(QUESTIONS.Q8.options[0].score.具 === 35, "Q8 數理應為具 +35");
    console.assert(QUESTIONS.Q8.options[1].score.操 === 35, "Q8 語文應為操 +35");
    console.assert(QUESTIONS.Q6.options.filter(x => x.score.放 === 30).length === 2, "Q6 應有兩個放 +30");
    console.assert(Object.values(QUESTIONS.Q15.options[1].score).reduce((a,b)=>a+b,0) === 30, "Q15 否應合計 30");
  }
  selfTest();
  render();
})();
</script>
</body>
</html>
