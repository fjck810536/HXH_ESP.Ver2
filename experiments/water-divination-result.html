function showResult(){resultName.textContent=TYPES[stateType];resultScore.textContent=`PREVIEW / Lv${stateLevel} / ${previewPercent()}%`;let extra=TYPE_NOTE[stateType];if(stateType==='specialize'&&specialRecipe){extra+=`\n疊加：${specialRecipe.secondaries.map(x=>TYPES[x.type]+' Lv'+x.level).join('、')||'無'}\n異常：${specialRecipe.anomalies.join(' / ')}`}resultNote.textContent=extra;resultEl.classList.add('show')}
function replay(){prepareRun()}
typeBtns.forEach(b=>b.onclick=()=>{stateType=b.dataset.type;typeBtns.forEach(x=>x.classList.toggle('on',x===b));replay()});levelBtns.forEach(b=>b.onclick=()=>{stateLevel=+b.dataset.level;levelBtns.forEach(x=>x.classList.toggle('on',x===b));replay()});document.querySelector('#replay').onclick=replay;document.querySelector('#reseed').onclick=()=>{seed=(Math.random()*999999)|0;replay()};
function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();const scale=Math.max(.48,Math.min(.74,520/Math.max(w,h)));renderer.setSize(Math.round(w*scale),Math.round(h*scale),false);renderer.domElement.style.width=w+'px';renderer.domElement.style.height=h+'px'}addEventListener('resize',resize);resize();
let last=0;const step=1000/12;function loop(t){requestAnimationFrame(loop);if(t-last<step)return;last=t;const s=t*.001;root.rotation.y=.22+Math.sin(s*.18)*.11;const dots=t<firstDotAt?0:Math.min(5,Math.floor((t-firstDotAt)/600)+1);revealEl.textContent='您的念能力是'+'.'.repeat(dots);const p=t<firstDotAt?0:clamp((t-firstDotAt)/3000);applyVisual(t,p);if(p>=1&&t>firstDotAt+3300&&!resultEl.classList.contains('show'))showResult();renderer.render(scene,camera)}prepareRun();requestAnimationFrame(loop);
</script>
