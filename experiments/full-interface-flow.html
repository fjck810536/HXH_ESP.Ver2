<body>
<div id="world"></div><div id="shade"></div><div id="phaseCurtain"></div>
<div class="labtag"><strong>FULL FLOW LAB.03</strong><br>LOCKED PARTS EMBEDDED</div>
<section id="homeUI">
  <div class="home-card corner">
    <div class="home-kicker">HXH_ESP.Ver2</div>
    <h1 class="home-title">念能力測驗</h1>
    <div class="home-sub">水見式人格測驗／互動介面流程實驗。<br>水杯是整個測驗共用的舞台。</div>

    <div class="home-note">主選單刻意覆蓋在完整水杯前方。水杯位於較遠處並緩慢自轉；點擊開始後，主選單往上離場，測驗介面由下方翻入。</div>
  </div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import {QUESTIONS,NEXT,TYPES,TYPE_NAMES} from '../main-quiz-data.js';

const wait=ms=>new Promise(r=>setTimeout(r,ms));
const world=document.querySelector('#world'),shade=document.querySelector('#shade'),homeUI=document.querySelector('#homeUI'),quizUI=document.querySelector('#quizUI'),qMeta=document.querySelector('#qMeta'),progress=document.querySelector('#progress'),optionsEl=document.querySelector('#options'),questionEl=document.querySelector('#question'),questionDock=document.querySelector('#questionDock'),confirmBtn=document.querySelector('#confirm'),optionScroll=document.querySelector('#optionScroll'),waterFx=document.querySelector('#waterFx'),hexFx=document.querySelector('#hexFx'),finalCard=document.querySelector('#finalCard');
const scores=Object.fromEntries(TYPES.map(k=>[k,0]));let currentKey='Q1',locked=false,multiSelected=new Set(),flowEnded=false,narrationSeen=new Set();

/* hard-lock mobile zoom / gestures; scroll is explicitly re-enabled only on quiz text fields */
for(const eventName of ['gesturestart','gesturechange','gestureend'])document.addEventListener(eventName,e=>e.preventDefault(),{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
let lastTapAt=0,lastTapTarget=null;document.addEventListener('touchend',e=>{const now=Date.now();if(lastTapTarget===e.target&&now-lastTapAt<320)e.preventDefault();lastTapAt=now;lastTapTarget=e.target},{passive:false});

/* ---------- persistent water-cup world ---------- */
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setClearColor(0x000000);renderer.setPixelRatio(1);world.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(34,1,.1,50);scene.add(new THREE.AmbientLight(0xffffff,1.12));const keyLight=new THREE.DirectionalLight(0xffffff,1.45);keyLight.position.set(3,4,4);scene.add(keyLight);const rimLight=new THREE.DirectionalLight(0x8db7ff,.55);rimLight.position.set(-3,1,-3);scene.add(rimLight);
const root=new THREE.Group();root.position.y=-.55;scene.add(root);const look=new THREE.Vector3(0,-.52,0),targetPos=new THREE.Vector3(0,-.28,8.35),targetLook=new THREE.Vector3(0,-.52,0);camera.position.copy(targetPos);camera.lookAt(targetLook);let worldMode='home';
const views={home:{p:[0,-.28,8.35],l:[0,-.52,0]},quiz:{p:[0,6.75,1.20],l:[0,.12,0]},clean:{p:[0,.95,6.25],l:[0,.30,0]},water:{p:[3.2,1.78,4.85],l:[0,.22,0]}};
function setCameraMode(name){worldMode=name;targetPos.set(...views[name].p);targetLook.set(...views[name].l)}
function edge(mesh,color=0xffffff,opacity=.18){const g=new THREE.EdgesGeometry(mesh.geometry,12);mesh.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color,transparent:true,opacity})))}
function leafGeo(){const st=[[-.36,.045,0,.004,-.006],[-.20,.185,.018,.014,-.010],[.02,.275,.032,.020,.008],[.23,.175,.022,.014,-.004],[.41,.018,.004,.003,0]],p=[],ix=[];for(const[z,w,h,d,sl]of st)p.push(-w+sl,h-d,z,sl,h,z,w+sl,h-d*.9,z);for(let r=0;r<4;r++){const a=r*3,b=a+3;ix.push(a,b,a+1,a+1,b,b+1,a+1,b+1,a+2,a+2,b+1,b+2)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setIndex(ix);g.computeVertexNormals();return g}
const n=12,model=new THREE.Group();root.add(model);const glass=new THREE.Mesh(new THREE.LatheGeometry([new THREE.Vector2(.74,0),new THREE.Vector2(.94,.09),new THREE.Vector2(1.02,1.55),new THREE.Vector2(1.10,2.5)],n),new THREE.MeshPhongMaterial({color:0xcfe4ff,emissive:0x080d14,transparent:true,opacity:.27,flatShading:true,side:THREE.DoubleSide,depthWrite:false,shininess:18}));glass.position.y=-1.28;model.add(glass);edge(glass,0xd8eaff,.23);
const bottom=new THREE.Mesh(new THREE.CylinderGeometry(.80,.80,.11,n),new THREE.MeshPhongMaterial({color:0xb7c9df,transparent:true,opacity:.22,flatShading:true,side:THREE.DoubleSide,depthWrite:false}));bottom.position.y=-1.22;model.add(bottom);edge(bottom,0xb9d2ef,.18);
const rim=new THREE.Mesh(new THREE.TorusGeometry(1.10,.032,3,n),new THREE.MeshBasicMaterial({color:0xf6fbff,transparent:true,opacity:.48}));rim.rotation.x=Math.PI/2;rim.position.y=1.20;model.add(rim);
const water=new THREE.Mesh(new THREE.CylinderGeometry(.91,.84,1.62,n),new THREE.MeshPhongMaterial({color:0x3d78a5,emissive:0x071a2b,transparent:true,opacity:.67,flatShading:true,side:THREE.DoubleSide}));water.position.y=-.37;model.add(water);edge(water,0x8fc6ef,.10);
const surface=new THREE.Mesh(new THREE.CircleGeometry(.91,n),new THREE.MeshPhongMaterial({color:0x69a9d6,emissive:0x091a28,transparent:true,opacity:.76,flatShading:true,side:THREE.DoubleSide}));surface.rotation.x=-Math.PI/2;surface.position.y=.45;model.add(surface);edge(surface,0xc6e8ff,.15);
const leafGroup=new THREE.Group(),leaf=new THREE.Mesh(leafGeo(),new THREE.MeshPhongMaterial({color:0x688f43,emissive:0x10180a,flatShading:true,side:THREE.DoubleSide,shininess:5}));leafGroup.add(leaf);const petiole=new THREE.Mesh(new THREE.CylinderGeometry(.010,.014,.18,4,1,false),new THREE.MeshPhongMaterial({color:0x4b642c,emissive:0x0b1006,flatShading:true}));petiole.rotation.x=Math.PI/2;petiole.position.set(-.004,-.003,-.445);leafGroup.add(petiole);leafGroup.position.set(.16,.485,-.03);leafGroup.rotation.set(.055,.54,-.045);model.add(leafGroup);
function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();const scale=Math.max(.46,Math.min(.72,480/Math.max(w,h)));renderer.setSize(Math.round(w*scale),Math.round(h*scale),false);renderer.domElement.style.width=w+'px';renderer.domElement.style.height=h+'px'}addEventListener('resize',resize);resize();
let last=0;const worldStep=1000/12;function worldLoop(t){requestAnimationFrame(worldLoop);if(t-last<worldStep)return;last=t;const s=t*.001;camera.position.lerp(targetPos,.18);look.lerp(targetLook,.18);camera.lookAt(look);if(worldMode==='home'){root.rotation.y=s*.12}else if(worldMode==='quiz'){root.rotation.y+=(0-root.rotation.y)*.16}else if(worldMode==='clean'){root.rotation.y+=(.10-root.rotation.y)*.14}else{root.rotation.y+=(0-root.rotation.y)*.13}surface.position.y=.45+Math.sin(s*1.8)*.015;water.scale.x=1+Math.sin(s*1.4)*.006;water.scale.z=1+Math.cos(s*1.6)*.006;leafGroup.position.x=.16+Math.cos(s*.78)*.038;leafGroup.position.z=-.03+Math.sin(s*.72)*.045;leafGroup.position.y=surface.position.y+.026;leafGroup.rotation.x=.055+Math.sin(s*.85)*.018;leafGroup.rotation.y=.54+Math.sin(s*.52)*.035;leafGroup.rotation.z=-.045+Math.cos(s*.67)*.022;renderer.render(scene,camera)}requestAnimationFrame(worldLoop);

/* ---------- quiz interface ---------- */
function resetOptions(){optionsEl.replaceChildren();multiSelected.clear();questionDock.classList.remove('has-confirm');confirmBtn.onclick=null;optionScroll.scrollTop=optionScroll.scrollHeight}
function cleanQuestionText(text){return text.replace(/^－－+[\s\S]*?Q\d+\s*/,'').replace(/^Q\d+\s*/,'').trim()}
async function revealNodes(nodes,gap){for(const node of nodes){optionsEl.appendChild(node);void node.offsetWidth;node.classList.add('show');await wait(gap)}}
function addScore(score){for(const[k,v]of Object.entries(score||{}))scores[k]=(scores[k]||0)+v}
function nextFor(option){return option.next||NEXT[currentKey]||'RESULT'}
async function showNarration(text,ms=1250){locked=true;resetOptions();qMeta.textContent='SYSTEM';questionEl.classList.add('narration');questionEl.textContent=text;progress.textContent='...';await wait(ms);locked=false}
async function maybeNarrate(key){if(key==='Q11'&&!narrationSeen.has('multi')){narrationSeen.add('multi');await showNarration('－－－－進入多選題囉－－－－',1400)}if(key==='Q15'&&!narrationSeen.has('yesno')){narrationSeen.add('yesno');await showNarration('－－－－是非題來啦－－－－',1250)}}
async function goTo(key){if(flowEnded)return;if(key==='RESULT'){finishQuiz();return}currentKey=key;await maybeNarrate(key);renderQuestion(key)}
function renderQuestion(key){const q=QUESTIONS[key];if(!q)return finishQuiz();locked=false;resetOptions();qMeta.textContent=q.id;progress.textContent=q.type==='multi'?'MULTI':'SELECT 1';questionEl.classList.remove('narration');questionEl.textContent=cleanQuestionText(q.text);const nodes=q.options.map((opt,idx)=>{if(q.type==='multi'){const b=document.createElement('button');b.className='bubble multi-bubble';b.innerHTML='<span class="check"></span><span></span>';b.lastElementChild.textContent=opt.text;b.onclick=()=>{if(locked)return;if(multiSelected.has(idx)){multiSelected.delete(idx);b.classList.remove('selected')}else{multiSelected.add(idx);b.classList.add('selected')}};return b}else{const b=document.createElement('button');b.className='bubble';b.textContent=opt.text;b.onclick=async()=>{if(locked)return;locked=true;b.classList.add('chosen');for(const x of optionsEl.children)x.disabled=true;addScore(opt.score);await wait(260);goTo(nextFor(opt))};return b}});if(q.type==='multi'){questionDock.classList.add('has-confirm');confirmBtn.textContent=q.confirmText||'《確定》';confirmBtn.onclick=async()=>{if(locked)return;locked=true;for(const idx of multiSelected)addScore(q.options[idx].score);confirmBtn.disabled=true;await wait(260);confirmBtn.disabled=false;goTo(NEXT[key]||'RESULT')}}revealNodes(nodes,q.type==='multi'?85:75)}

async function startFlow(){homeUI.classList.add('exit');shade.className='quiz';setCameraMode('quiz');await wait(170);quizUI.classList.add('active');await wait(720);await showNarration('接下來開始進行測驗。',1050);goTo('Q1')}

/* ---------- result ritual: clean cup → locked water lab → locked hex lab ---------- */
function winnerType(){return TYPES.reduce((a,b)=>scores[b]>scores[a]?b:a,TYPES[0])}
function demoPercentages(){const max=Math.max(1,...Object.values(scores));return Object.fromEntries(TYPES.map(k=>[k,Math.round(scores[k]/max*100)]))}
async function finishQuiz(){if(flowEnded)return;flowEnded=true;locked=true;quizUI.classList.add('exit');shade.className='clear';setCameraMode('clean');await wait(950);setCameraMode('water');await wait(950);mountWaterEffect()}
function styleWaterFrame(doc){const style=doc.createElement('style');style.textContent='.ui,.back{display:none!important}#result{display:none!important}';doc.head.appendChild(style)}
function mountWaterEffect(){waterFx.replaceChildren();const frame=document.createElement('iframe');frame.src='./water-divination-stress-v5.html?flow='+Date.now();waterFx.appendChild(frame);frame.onload=async()=>{const doc=frame.contentDocument;styleWaterFrame(doc);const typeMap={強:'enhance',變:'transmute',具:'conjure',特:'specialize',操:'manipulate',放:'emit'},win=winnerType();const typeBtn=doc.querySelector(`.type[data-t="${typeMap[win]}"]`),lvBtn=doc.querySelector('.lv[data-l="2"]');typeBtn?.click();lvBtn?.click();doc.querySelector('#replay')?.click();await wait(80);waterFx.classList.add('show');const result=doc.querySelector('#result');if(!result){setTimeout(mountHexEffect,3300);return}const obs=new MutationObserver(()=>{if(result.classList.contains('show')){obs.disconnect();setTimeout(mountHexEffect,260)}});obs.observe(result,{attributes:true,attributeFilter:['class']})}}
function styleHexFrame(doc){const style=doc.createElement('style');style.textContent='html,body{background:transparent!important}body{padding:0!important;overflow:hidden!important}.head,.lab-note,.controls{display:none!important}main{width:100%!important;margin:0!important}.stage{width:100%!important;height:100%!important;min-height:0!important;border:0!important;background:rgba(0,0,0,.76)!important}.screen{width:100%!important;height:100%!important;max-height:none!important}';doc.head.appendChild(style);doc.querySelector('svg rect')?.setAttribute('fill','transparent')}
function mountHexEffect(){hexFx.replaceChildren();hexFx.classList.remove('compact');const frame=document.createElement('iframe');frame.src='./hex-score-reveal.html?flow='+Date.now();hexFx.appendChild(frame);frame.onload=()=>{const doc=frame.contentDocument;styleHexFrame(doc);const pct=demoPercentages();const order=['強','變','具','特','操','放'];[...doc.querySelectorAll('.row')].forEach((row,i)=>{const input=row.querySelector('input');if(!input||!order[i])return;input.value=pct[order[i]];input.dispatchEvent(new Event('input',{bubbles:true}))});hexFx.classList.add('show');const poly=doc.querySelector('#scorePoly');if(!poly){setTimeout(showFinal,2200);return}const obs=new MutationObserver(()=>{if(poly.classList.contains('settled')){obs.disconnect();setTimeout(showFinal,340)}});obs.observe(poly,{attributes:true,attributeFilter:['class']})}}
function showFinal(){const win=winnerType(),pct=demoPercentages();document.querySelector('#resultName').textContent=TYPE_NAMES[win];document.querySelector('#resultCopy').textContent=`目前 raw score 最高為 ${TYPE_NAMES[win]}。六邊形已完成定位；正式結算卡最後才彈出。\n\n強 ${pct.強}%　變 ${pct.變}%　具 ${pct.具}%　特 ${pct.特}%　操 ${pct.操}%　放 ${pct.放}%`;finalCard.classList.add('show');setTimeout(()=>hexFx.classList.add('compact'),120)}

/* ---------- controls ---------- */
document.querySelector('#start').onclick=startFlow;document.querySelector('#about').onclick=()=>{document.querySelector('.home-sub').textContent='這一頁專門測試：主選單退場、測驗介面翻入、鏡頭俯視、旁白、多選提示、清場、水見式、六邊形與最後結算。'};
document.querySelector('#skip').onclick=async()=>{if(flowEnded)return;Object.assign(scores,{強:92,變:67,具:43,特:18,操:76,放:51});homeUI.classList.add('exit');quizUI.classList.add('active');shade.className='quiz';setCameraMode('quiz');await wait(350);finishQuiz()};
document.querySelector('#restart').onclick=()=>location.reload();document.querySelector('#home').onclick=()=>location.reload();
</script>
</body>
