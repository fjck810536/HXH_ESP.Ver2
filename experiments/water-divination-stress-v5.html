abel">LEVEL</span><button class="lv" data-l="1">Lv1</button><button class="lv on" data-l="2">Lv2</button><button class="lv" data-l="3">Lv3</button><button id="replay">REPLAY</button><button id="reseed">RESEED</button></div><div class="row"><span class="label">ENH3</span><button id="enh3A" class="on">A 局部溢流</button><button id="enh3B">B 方塊噴出</button></div><div class="row"><span class="label">EMIT3</span><button id="emitSeeded" class="on" disabled title="RESEED 才會重抽">SEED → --</button></div><div id="debug" class="debug"></div></div><div id="reveal" class="reveal">您的念能力是</div><div id="result" class="result"><div id="resultName" class="name"></div><div id="resultScore" class="score"></div><div id="resultNote" class="note"></div></div><a class="back" href="../">← HXH_ESP.Ver2</a><script>(async()=>{try{const files=[1,2,3,4].map(i=>`./water-divination-stress-v4-core-${i}.txt?v=v5base`).concat('./water-divination-stress-v5-patch.txt?v=56192843');const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);return r.text()}));const url=URL.createObjectURL(new Blob([parts.join('')],{type:'text/javascript'}));await import(url);URL.revokeObjectURL(url)}catch(e){document.body.textContent='v5 module load failed: '+e.message;console.error(e)}})();</script></body></html>
