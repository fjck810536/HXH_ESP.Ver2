<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Old 3D Glass Experiment</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#eee;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;min-height:100%}body{min-height:100svh;overflow:hidden}#stage{position:fixed;inset:0;background:#000}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.ui{position:fixed;left:14px;top:14px;z-index:3;display:grid;gap:8px;max-width:min(92vw,420px);font-size:12px}.title{font-size:14px;font-weight:700;letter-spacing:.08em}.sub{color:#888;line-height:1.5}.controls{display:flex;gap:6px}.controls button{border:1px solid #444;background:#111;color:#aaa;padding:7px 11px;font:inherit;cursor:pointer}.controls button.on{background:#ddd;color:#000;border-color:#fff}.readout{color:#777}.tag{color:#aaa}.back{position:fixed;right:14px;top:14px;z-index:3;color:#777;text-decoration:none;font-size:12px}.back:hover{color:#fff}
</style></head><body><div id="stage"></div><div class="ui"><div class="title">OLD 3D GLASS / MODEL TEST</div><div class="sub">low-poly glass + water + floating leaf<br><span class="tag">black void / flat shade / ~12fps</span></div><div class="controls"><button class="on" data-n="12">12</button><button data-n="18">18</button><button data-n="24">24</button></div><div class="readout">FACETS: <span id="facets">12</span></div></div><a class="back" href="../">← HXH_ESP.Ver2</a>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const host=document.querySelector('#stage'),facets=document.querySelector('#facets'),buttons=[...document.querySelectorAll('button[data-n]')];
const renderer=new THREE.WebGLRenderer({antialias:false});renderer.setClearColor(0x000000);renderer.setPixelRatio(1);host.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(34,1,.1,50);camera.position.set(0,.9,6.2);camera.lookAt(0,.45,0);
scene.add(new THREE.AmbientLight(0xffffff,1.15));const a=new THREE.DirectionalLight(0xffffff,1.45);a.position.set(3,4,4);scene.add(a);const b=new THREE.DirectionalLight(0x8db7ff,.55);b.position.set(-3,1,-3);scene.add(b);
const root=new THREE.Group();root.position.y=-.55;scene.add(root);let model=null;
function edge(mesh,color=0xffffff,opacity=.18){const g=new THREE.EdgesGeometry(mesh.geometry,12);mesh.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color,transparent:true,opacity})))}
function leafGeo(){const s=new THREE.Shape();s.moveTo(0,.34);s.lineTo(.19,.19);s.lineTo(.34,0);s.lineTo(.17,-.23);s.lineTo(0,-.34);s.lineTo(-.17,-.23);s.lineTo(-.34,0);s.lineTo(-.19,.19);s.closePath();const g=new THREE.ExtrudeGeometry(s,{depth:.035,bevelEnabled:false});g.center();g.rotateX(Math.PI/2);return g}
function disposeGroup(g){g.traverse(o=>{o.geometry?.dispose();if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose?.())}})}
function build(n){if(model){root.remove(model);disposeGroup(model)}model=new THREE.Group();root.add(model);
 const profile=[new THREE.Vector2(.74,0),new THREE.Vector2(.94,.09),new THREE.Vector2(1.02,1.55),new THREE.Vector2(1.10,2.5)];
 const glass=new THREE.Mesh(new THREE.LatheGeometry(profile,n),new THREE.MeshPhongMaterial({color:0xcfe4ff,emissive:0x080d14,transparent:true,opacity:.27,flatShading:true,side:THREE.DoubleSide,depthWrite:false,shininess:18}));glass.position.y=-1.28;model.add(glass);edge(glass,0xd8eaff,.23);
 const bottom=new THREE.Mesh(new THREE.CylinderGeometry(.80,.80,.11,n),new THREE.MeshPhongMaterial({color:0xb7c9df,transparent:true,opacity:.22,flatShading:true,side:THREE.DoubleSide,depthWrite:false}));bottom.position.y=-1.22;model.add(bottom);edge(bottom,0xb9d2ef,.18);
 const rim=new THREE.Mesh(new THREE.TorusGeometry(1.10,.032,3,n),new THREE.MeshBasicMaterial({color:0xf6fbff,transparent:true,opacity:.48}));rim.rotation.x=Math.PI/2;rim.position.y=1.20;model.add(rim);
 const water=new THREE.Mesh(new THREE.CylinderGeometry(.91,.84,1.62,n),new THREE.MeshPhongMaterial({color:0x3d78a5,emissive:0x071a2b,transparent:true,opacity:.67,flatShading:true,side:THREE.DoubleSide}));water.position.y=-.37;model.add(water);edge(water,0x8fc6ef,.10);
 const surface=new THREE.Mesh(new THREE.CircleGeometry(.91,n),new THREE.MeshPhongMaterial({color:0x69a9d6,emissive:0x091a28,transparent:true,opacity:.76,flatShading:true,side:THREE.DoubleSide}));surface.rotation.x=-Math.PI/2;surface.position.y=.45;model.add(surface);edge(surface,0xc6e8ff,.15);
 const leaf=new THREE.Mesh(leafGeo(),new THREE.MeshPhongMaterial({color:0x678d47,emissive:0x121b0b,flatShading:true,side:THREE.DoubleSide}));leaf.position.set(.16,.50,-.03);leaf.rotation.set(.04,.5,-.28);model.add(leaf);edge(leaf,0x96b876,.12);
 const vein=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-.22,.505,-.03),new THREE.Vector3(.24,.505,-.03)]),new THREE.LineBasicMaterial({color:0x2b3c1b}));vein.rotation.y=.5;model.add(vein);
 model.userData={water,surface,leaf,n};facets.textContent=n}
buttons.forEach(btn=>btn.onclick=()=>{buttons.forEach(x=>x.classList.remove('on'));btn.classList.add('on');build(+btn.dataset.n)});build(12);
function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();const scale=Math.max(.45,Math.min(.72,480/Math.max(w,h)));renderer.setSize(Math.round(w*scale),Math.round(h*scale),false);renderer.domElement.style.width=w+'px';renderer.domElement.style.height=h+'px'}addEventListener('resize',resize);resize();
let last=0;const step=1000/12;function loop(t){requestAnimationFrame(loop);if(t-last<step)return;last=t;const s=t*.001;root.rotation.y=.3+s*.34;root.rotation.x=Math.sin(s*.45)*.025;if(model){const{water,surface,leaf}=model.userData;surface.position.y=.45+Math.sin(s*1.8)*.015;water.scale.x=1+Math.sin(s*1.4)*.006;water.scale.z=1+Math.cos(s*1.6)*.006;leaf.position.x=.16+Math.cos(s*1.1)*.07;leaf.position.z=-.03+Math.sin(s*1.15)*.08;leaf.position.y=surface.position.y+.045;leaf.rotation.z=-.28+Math.sin(s*1.3)*.1;leaf.rotation.y+=.012}renderer.render(scene,camera)}requestAnimationFrame(loop);
</script></body></html>
