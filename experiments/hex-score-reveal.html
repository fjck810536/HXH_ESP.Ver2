<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HEX SCORE REVEAL LAB</title>
<style>
:root{color-scheme:dark;--bg:#000;--fg:#dedede;--muted:#696969;--line:#777;--hot:#f0f0f0;--panel:#050505}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,"Noto Sans Mono CJK TC","Noto Sans TC",monospace}body{min-height:100svh;padding:18px 12px calc(26px + env(safe-area-inset-bottom));overflow-x:hidden}body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.035;background:repeating-linear-gradient(0deg,#fff 0,#fff 1px,transparent 1px,transparent 4px)}main{width:min(100%,780px);margin:0 auto}.head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:12px}.eyebrow{font-size:11px;letter-spacing:.16em;color:#777}.status{font-size:10px;color:#666;text-align:right}.stage{position:relative;border:2px solid #555;background:#020202;min-height:440px;overflow:hidden}.stage::before,.stage::after{content:"";position:absolute;background:#000;z-index:3;pointer-events:none}.stage::before{width:18px;height:3px;left:-2px;top:18px}.stage::after{width:3px;height:18px;right:18px;bottom:-2px}.screen{display:block;width:100%;height:auto;aspect-ratio:1/1;max-height:620px}.axis{stroke:#393939;stroke-width:1}.ring-seg{stroke:#929292;stroke-width:1.35;stroke-linecap:square;vector-effect:non-scaling-stroke}.ring-group{opacity:0;transform-box:view-box;transform-origin:180px 180px}.stage.run .ring-1{animation:ringPop 115ms steps(4,end) 95ms forwards}.stage.run .ring-2{animation:ringPop 115ms steps(4,end) 155ms forwards}.outer-edge{stroke:#fff;stroke-width:6;stroke-linecap:square;stroke-linejoin:miter;vector-effect:non-scaling-stroke;opacity:0}.stage.run .outer-edge{animation:outerEdgeIn 1ms linear 215ms forwards}.core{opacity:0}.stage.run .core{animation:corePop 100ms steps(3,end) 45ms forwards}.score-poly{fill:rgba(255,255,255,0);stroke:#efefef;stroke-width:2;vector-effect:non-scaling-stroke}.score-poly.settled{fill:rgba(255,255,255,.12)}.score-point{fill:#efefef}.score-value{font-size:10px;fill:#aaa;letter-spacing:.04em}.score-name{font-size:11px;fill:#d8d8d8;letter-spacing:.05em}.lv{font-size:9px;fill:#5f5f5f;letter-spacing:.10em}.lab-note{margin:12px 0 0;color:#777;font-size:11px;line-height:1.6}.controls{margin-top:14px;border:2px solid #444;padding:14px;background:#020202}.buttons{display:flex;gap:8px;margin-bottom:14px}button{appearance:none;border:2px solid #666;border-radius:0;background:#050505;color:#ddd;font:inherit;padding:9px 13px;min-height:40px;cursor:pointer}button:hover{border-color:#aaa;color:#fff}button.primary{background:#ddd;color:#000;border-color:#eee;font-weight:800}.sliders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px 16px}.row{display:grid;grid-template-columns:42px 1fr 38px;align-items:center;gap:8px;font-size:12px;color:#aaa}.row output{text-align:right;color:#ddd}input[type=range]{width:100%;accent-color:#ddd}.mapping{margin-top:14px;padding-top:12px;border-top:1px dashed #333;font-size:10px;color:#666;line-height:1.7}.mapping strong{color:#aaa}@keyframes corePop{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(2.2)}100%{opacity:1;transform:scale(1)}}@keyframes ringPop{0%{opacity:0;transform:scale(.02)}35%{opacity:1}100%{opacity:1;transform:scale(1)}}@keyframes outerEdgeIn{to{opacity:1}}@media(max-width:560px){body{padding-left:8px;padding-right:8px}.stage{min-height:0}.sliders{grid-template-columns:1fr}.head{align-items:start}.status{font-size:9px}.score-name{font-size:10px}.score-value{font-size:9px}}@media(prefers-reduced-motion:reduce){.ring-group,.core{animation:none!important;opacity:1!important;transform:none!important}.outer-edge{animation:none!important;opacity:1!important}}
</style>
</head>
<body>
<main>
  <div class="head"><div><div class="eyebrow">HXH_ESP.Ver2 / HEX REVEAL LAB.01</div><div style="margin-top:5px;font-size:14px">三級六邊形量表出場</div></div><div class="status">VISUAL 12 FPS<br>40 / 70 BREAKPOINTS</div></div>
  <section class="stage" id="stage">
    <svg id="hex" class="screen" viewBox="0 0 360 360" role="img" aria-label="三級念能力六邊形量表動畫">
      <rect width="360" height="360" fill="#020202"/>
      <g id="axes"></g>
      <g id="rings"></g>
      <g id="outerFrameLayer"></g>
      <polygon id="scorePoly" class="score-poly" points="180,180 180,180 180,180 180,180 180,180 180,180"/>
      <g id="points"></g>
      <circle class="core" cx="180" cy="180" r="3" fill="#d8d8d8"/>
      <g id="labels"></g>
      <g id="lvLabels"></g>
    </svg>
  </section>
  <p class="lab-note">Lv1、Lv2 是內部分水嶺；100% 最外圍改成六條獨立實體粗線，直接把六個 100 頂點首尾密封連接。</p>
  <section class="controls">
    <div class="buttons"><button class="primary" id="replay">REPLAY</button><button id="random">RANDOM</button></div>
    <div class="sliders" id="sliders"></div>
    <div class="mapping"><strong>分段映射</strong><br>0 → 40% 分數 = 中心 → 第一道線；40 → 70% = 第一道線 → 第二道線；70 → 100% = 第二道線 → 最外圍粗框。三段視覺距離相同，但第一段要跑 40 分，後兩段各只跑 30 分。</div>
  </section>
</main>
<script>
const ORDER=[['強','強化系'],['變','變化系'],['具','具現化系'],['特','特質系'],['操','操作系'],['放','放出系']];
const DEFAULT={強:92,變:67,具:43,特:18,操:76,放:51};
const CX=180,CY=180,R=112,LABEL_R=148,VALUE_R=132,FPS=12,FRAME=1000/FPS;
const stage=document.getElementById('stage'),rings=document.getElementById('rings'),outerFrameLayer=document.getElementById('outerFrameLayer'),axes=document.getElementById('axes'),pointsG=document.getElementById('points'),labels=document.getElementById('labels'),lvLabels=document.getElementById('lvLabels'),poly=document.getElementById('scorePoly'),sliders=document.getElementById('sliders');
let values={...DEFAULT},runId=0,lastFrame=0;
function polar(i,r){const a=-Math.PI/2+i*Math.PI/3;return{x:CX+Math.cos(a)*r,y:CY+Math.sin(a)*r};}
function lerp(a,b,t){return a+(b-a)*t;}
function radiusRatio(score){const s=Math.max(0,Math.min(100,score));if(s<40)return(s/40)/3;if(s<70)return 1/3+((s-40)/30)/3;return 2/3+((s-70)/30)/3;}
function shortSegment(a,b,gap=.12){return[{x:lerp(a.x,b.x,gap),y:lerp(a.y,b.y,gap)},{x:lerp(a.x,b.x,1-gap),y:lerp(a.y,b.y,1-gap)}];}
function makeLine(a,b,cls=''){const e=document.createElementNS('http://www.w3.org/2000/svg','line');e.setAttribute('x1',a.x);e.setAttribute('y1',a.y);e.setAttribute('x2',b.x);e.setAttribute('y2',b.y);if(cls)e.setAttribute('class',cls);return e;}
function makeText(x,y,text,cls,anchor='middle'){const e=document.createElementNS('http://www.w3.org/2000/svg','text');e.setAttribute('x',x);e.setAttribute('y',y);e.setAttribute('class',cls);e.setAttribute('text-anchor',anchor);e.setAttribute('dominant-baseline','middle');e.textContent=text;return e;}
function buildStatic(){axes.replaceChildren();rings.replaceChildren();outerFrameLayer.replaceChildren();labels.replaceChildren();lvLabels.replaceChildren();pointsG.replaceChildren();
  for(let i=0;i<6;i++)axes.appendChild(makeLine({x:CX,y:CY},polar(i,R),'axis'));
  [1/3,2/3].forEach((ratio,idx)=>{const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class',`ring-group ring-${idx+1}`);const ps=Array.from({length:6},(_,i)=>polar(i,R*ratio));for(let i=0;i<6;i++){const [a,b]=shortSegment(ps[i],ps[(i+1)%6],.13);g.appendChild(makeLine(a,b,'ring-seg'));}rings.appendChild(g);});
  const outerPoints=Array.from({length:6},(_,i)=>polar(i,R));for(let i=0;i<6;i++)outerFrameLayer.appendChild(makeLine(outerPoints[i],outerPoints[(i+1)%6],'outer-edge'));
  ORDER.forEach(([key,name],i)=>{const lp=polar(i,LABEL_R),vp=polar(i,VALUE_R);let anchor='middle';if(lp.x>CX+8)anchor='start';else if(lp.x<CX-8)anchor='end';labels.appendChild(makeText(lp.x,lp.y,name,'score-name',anchor));const val=makeText(vp.x,vp.y,'0','score-value',anchor);val.dataset.key=key;labels.appendChild(val);const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('class','score-point');c.setAttribute('r','3.5');c.dataset.key=key;c.setAttribute('cx',CX);c.setAttribute('cy',CY);pointsG.appendChild(c);});
  const leftX=CX-R-17;[[1,R/3],[2,R*2/3],[3,R]].forEach(([lv,rr])=>{const p=polar(5,rr);lvLabels.appendChild(makeText(leftX,p.y,`LV${lv}`,'lv','end'));});
}
function buildControls(){sliders.replaceChildren();ORDER.forEach(([key,name])=>{const row=document.createElement('label');row.className='row';row.innerHTML=`<span>${key}</span><input type="range" min="0" max="100" step="1" value="${values[key]}" aria-label="${name}"><output>${values[key]}</output>`;const input=row.querySelector('input'),out=row.querySelector('output');input.addEventListener('input',()=>{values[key]=+input.value;out.value=input.value;});sliders.appendChild(row);});}
function setFrame(scores,settled=false){const pts=[];ORDER.forEach(([key],i)=>{const s=scores[key]||0,p=polar(i,R*radiusRatio(s));pts.push(`${p.x.toFixed(2)},${p.y.toFixed(2)}`);const c=pointsG.querySelector(`[data-key="${key}"]`);c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);const t=labels.querySelector(`[data-key="${key}"]`);t.textContent=String(Math.round(s));});poly.setAttribute('points',pts.join(' '));poly.classList.toggle('settled',settled);}
function replay(){const id=++runId;stage.classList.remove('run');poly.classList.remove('settled');setFrame(Object.fromEntries(ORDER.map(([k])=>[k,0])));void stage.offsetWidth;stage.classList.add('run');lastFrame=0;const start=performance.now()+430;const rate=100/1250;function tick(now){if(id!==runId)return;if(now<start){requestAnimationFrame(tick);return;}if(now-lastFrame<FRAME){requestAnimationFrame(tick);return;}lastFrame=now;const elapsed=now-start;const scoreCursor=elapsed*rate;let done=true;const current={};ORDER.forEach(([key])=>{current[key]=Math.min(values[key],scoreCursor);if(current[key]<values[key])done=false;});setFrame(current,false);if(done){setFrame(values,true);return;}requestAnimationFrame(tick);}requestAnimationFrame(tick);}
document.getElementById('replay').onclick=replay;document.getElementById('random').onclick=()=>{[...sliders.querySelectorAll('.row')].forEach((row,i)=>{const key=ORDER[i][0],v=Math.floor(Math.random()*101);values[key]=v;row.querySelector('input').value=v;row.querySelector('output').value=v;});replay();};
buildStatic();buildControls();setTimeout(replay,120);
</script>
</body>
</html>
